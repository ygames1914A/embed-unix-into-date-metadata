name: my-workflow
on:
  push:
    tags:
      - "v*"
jobs:
  linux-job:
    runs-on: ubuntu-latest
    steps:
      # ...
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      # run any `bun` or `bunx` command
      - run: bun install --frozen-lockfile --production
      - run: bun run build:linux
      - run: cp -r node_modules ./dist/

      - name: Archive Release
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: 'unixtodate-linux.zip'
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            unixtodate-linux.zip
          generate_release_notes: true
  windows-job:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: installing dependencies
        run: bun install --frozen-lockfile --production

      - name: building the application
        run: bun run build:win

      - name: adding node modules in the dist
        shell: pwsh
        run: Copy-Item -Path ".\node_modules" -Destination ".\dist\" -Recurse


      - name: Archive Release
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: 'unixtodate-windows.zip'
          path: dist
          
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            unixtodate-windows.zip
          generate_release_notes: true
        
